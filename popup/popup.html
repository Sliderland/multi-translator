<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Translate</h1>
      <button id="settingsButton" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <label for="provider">Provider</label>
    <select id="provider"></select>

    <label for="targetLanguage">Translate to</label>
    <select id="targetLanguage">
      <option value="en">English</option>
      <option value="sv">Swedish</option>
      <option value="da">Danish</option>
      <option value="nb">Norwegian</option>
      <option value="fi">Finnish</option>
      <option value="de">German</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="nl">Dutch</option>
      <option value="pl">Polish</option>
    </select>

    <div id="setupNotice" class="notice" hidden>
      <span id="setupText"></span>
      <button id="setupButton" type="button" class="link">Open Settings</button>
    </div>

    <button id="pageButton" class="primary">Translate this page</button>

    <section id="selectionSection" hidden>
      <div class="section-title">Selected text</div>
      <div id="selectedText" class="text-box"></div>
      <button id="translateButton" class="secondary">Translate selection</button>
    </section>

    <section id="resultSection" hidden>
      <div class="section-title">Translation</div>
      <div id="translation" class="text-box"></div>
    </section>

    <div id="status" role="status"></div>

    <footer>
      <button id="googleButton" type="button" class="link">Open in Google Translate instead</button>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
